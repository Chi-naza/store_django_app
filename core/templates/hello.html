<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<body> 
    {% if name %}
    <h1> My name is {{ name }} </h1>
    {% else %}
    <h1> My name is -- Empty </h1>
    {% endif %}

    <h2> My Products Below:</h2>

    <ul>
        {% for product in products %}
            <li>
                {{ product.title }}
            </li>
        {% endfor %}
    </ul>

     <h2>Created Object:</h2>
     <h4> {{ created }} </h4>
</body>
</html>
